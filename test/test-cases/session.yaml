tests:
- code: |
    \pyc{a = 'default'}
    \pysession{second}
    \pyc{a = 'second'}
    \py{a}
    \pysession{default}
    \py{a}
  pdf: second default
- code: |
    \pyc{a = 'default'}
    \pysession{second}
    \pyc{a = 'second'}
    \py[session=default]{a}
    \py{a}
  pdf: default second
- code: |
    % empty session
    \pyc{a = 'default'}
    \pysession{}
    \pyc{a = 'empty'}
    \pysession{default}
    \py[session=]{a}
    \py{a}
  pdf: empty default
- code: |
    \pyc[s=a]{x = 5}
    \pyc[s=b]{x = 7}
    \py[s=a]{x * \py[s=b]{x}}
  pdf: 35
