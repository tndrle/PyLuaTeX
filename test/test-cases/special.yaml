template: special_template.tex
tests:
- code: \SI{\py{3}}{\meter}
  pdf: 3 m
- code: \SI{\py[verbose]{3}}{\meter}
  log: |
    PyLuaTeX input for session "default": print(str(3), end='')
    PyLuaTeX output: 3
  pdf: 3 m
- code: |
    \begin{tikzpicture}
    \begin{axis}
    \addplot coordinates {
      \py{'(0,0) (1,3) '}
      \pyif[verbose]{1 == 2}{(3,0)}{ (2,1) }
      \pyif{1 == 1}{(3,0)}{(4,0)} };
    \draw (axis cs:\py [verbose] {'0,0'}) |- (axis cs:2,\py {3});
    \draw (\py{'axis cs:1,0'}) \py{'|-'} (axis cs:2,\py{2});
    \end{axis}
    \end{tikzpicture}
  log: |
    PyLuaTeX input for session "default": print(str('0,0'), end='')
    PyLuaTeX output: 0,0
  png: special_tikzpicture_ref.png
- code: |
    \begin{tabular}{cc}
    \py{'a & b'} \\
    \py{r'c & d \\'}
    e & f \\
    \py{1} & \pyc{print(2)}
    \end{tabular}
  pdf: |
    a b
    c d
    e f
    1 2
