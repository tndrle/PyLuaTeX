tests:
- id: options2
  code: |
    \begin{python}[ignoreerrors]
      print(1 / 0)
    \end{python}
  pdf: |
    Traceback (most recent call last): File ”<input>”, line 1, in <module>

    ZeroDivisionError: division by zero
  log: |
    PyLuaTeX input for session "default":   print(1 / 0)
    PyLuaTeX output: Traceback (most recent call last):
      File "<input>", line 1, in <module>
    ZeroDivisionError: division by zero
- id: custom-env
  code: |
    \NewDocumentEnvironment{custompy}{}
    {\PyLTVerbatimEnv\begin{python}}
    {\end{python}}

    \begin{custompy} % hide line
      print('Hello PyLuaTeX') # hide line
    \end{custompy} % hide line
  pdf: Hello PyLuaTeX
- id: logging
  code: |
    \begin{python}
      tex.log('This text goes to the LaTeX log.')
    \end{python}
  log: |
    This text goes to t
    he LaTeX log.
- id: ex-py-1
  code: \py{3 + 7}
  pdf: 10
- id: ex-pyc-1
  code: |
    \pyc{x = 5}
    \py{x} % hide line
  pdf: 5
- id: ex-pyc-2
  code: \pyc{print('hello')}
  pdf: hello
- id: ex-pyif-1
  code: |
    \pyc{a = 1} % hide line
    \pyif{a == 1}{$a = 1$}{$a \neq 1$}
  pdf: a = 1
- id: ex-pyoptions-1
  code: |
    \pyoptions{verbose,session=main}
    \py{1} % hide line
  pdf: 1
  log: |
    PyLuaTeX input for session "main": print(str(1), end='')
    PyLuaTeX output: 1
- id: ex-pyq-1
  code: |
    A % hide line
    \pyq{3 + 7}
  pdf: A
- id: ex-pycq-1
  code: |
    \pycq{x = 5}
    \py{x} % hide line
  pdf: 5
- id: ex-pysession-1
  code: |
    \pysession{main}
    \pyoptions{verbose} % hide line
    \py{1} % hide line
  pdf: 1
  log: |
    PyLuaTeX input for session "main": print(str(1), end='')
    PyLuaTeX output: 1
- id: ex-pyoption-1
  code: |
    \pyoption{verbose}{true}
    \py{1} % hide line
  pdf: 1
  log: |
    PyLuaTeX input for session "default": print(str(1), end='')
    PyLuaTeX output: 1
- id: ex-python-1
  code: |
    \begin{python}
      x = 'Hello PyLuaTeX'
      print(x)
    \end{python}
  pdf: Hello PyLuaTeX
- id: ex-ignoreerrors-1
  code: \py[ignore errors]{1 / 0}
  pdf: |
    Traceback (most recent call last): File ”<input>”, line 1, in <module>

    ZeroDivisionError: division by zero
  log: |
    ZeroDivisionError: division by zero
- id: ex-quiet-1
  code: |
    A % hide line
    \py[quiet]{7 + 4}
  pdf: A
